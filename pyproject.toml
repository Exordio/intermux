[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "intermux"
dynamic = ["version"]
description = "Run applications through a chosen network interface using network namespaces"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rishi Bhati" }, { name = "Exord" }]
requires-python = ">=3.9"
classifiers = [
    "Environment :: X11 Applications",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
]

[project.urls]
Homepage = "https://github.com/Exordio/intermux"

[project.scripts]
intermux = "intermux.cli:main"

[project.gui-scripts]
intermux-gui = "intermux.gui.app:main"

[tool.setuptools.dynamic]
version = { attr = "intermux.__version__" }

[tool.setuptools.packages.find]
include = ["intermux*"]

[tool.setuptools.package-data]
"intermux.gui" = ["icons/*.png"]
